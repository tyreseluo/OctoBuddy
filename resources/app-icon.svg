<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OctoBuddy's launcher art: a friendly octopus on a coral tile (the
       system assistant's tile is OctoSense purple; this one stays apart). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#e24a7b"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tile)"/>
  <!-- Its arms, curling out under the head. -->
  <g fill="none" stroke="#fffdf7" stroke-width="4.4" stroke-linecap="round">
    <path d="M20.5 38.5 C18.5 44 15.5 46.5 12.5 45.5"/>
    <path d="M27 40 C26.5 46.5 24 50.5 20.5 51.5"/>
    <path d="M37 40 C37.5 46.5 40 50.5 43.5 51.5"/>
    <path d="M43.5 38.5 C45.5 44 48.5 46.5 51.5 45.5"/>
  </g>
  <!-- Its head. -->
  <path d="M16.5 34.5 C16.5 21.5 23.5 12.5 32 12.5 C40.5 12.5 47.5 21.5 47.5 34.5 C47.5 38.4 45.4 41 42.4 41 H21.6 C18.6 41 16.5 38.4 16.5 34.5 Z" fill="#fffdf7"/>
  <!-- Its face: eyes with a glint, cheeks, a smile. -->
  <circle cx="26.3" cy="27.5" r="3.7" fill="#2b1d3a"/>
  <circle cx="37.7" cy="27.5" r="3.7" fill="#2b1d3a"/>
  <circle cx="27.5" cy="26.2" r="1.25" fill="#fffdf7"/>
  <circle cx="38.9" cy="26.2" r="1.25" fill="#fffdf7"/>
  <circle cx="21.8" cy="33" r="2.2" fill="#ffc2cd"/>
  <circle cx="42.2" cy="33" r="2.2" fill="#ffc2cd"/>
  <path d="M28.6 33.6 Q32 36.8 35.4 33.6" fill="none" stroke="#2b1d3a" stroke-width="2.1" stroke-linecap="round"/>
</svg>
