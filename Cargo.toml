[package]
name = "octosense-octobuddy"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "OctoBuddy: OctoSense's native coding app with an outer loop that plans and inner loops that build"

# Built on its own, OctoBuddy takes OctoSense main's pins (its root
# Cargo.toml) for OctoSense and App Hub, and the Makepad that this App Hub
# names (1f3b1de, nine commits before OctoSense's e29a0eaa): Cargo cannot
# patch a git source with another revision of the same repository, so one
# Makepad here means App Hub's. Inside OctoSense its [patch] sections resolve
# all of them to the shell's own checkouts. Move them with OctoSense's.
# As Rinx: one view, two shapes. On the host (the default) it is an app of
# its own, in a window of its own; OctoSense builds it with
# `--no-default-features --features octosense-module` and hosts its module.
[features]
default = ["standalone"]
standalone = []
octosense-module = ["dep:makepad-app-module"]

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1f3b1dedfbb81424eb8dbf69e5e2c634fa73dc54" }
# The module OctoSense hosts (feature `octosense-module`).
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1f3b1dedfbb81424eb8dbf69e5e2c634fa73dc54", optional = true }
# The native TUI plugin: an agent's own terminal UI, in a terminal of
# Makepad's (its PTY and emulator), as Director embeds it.
makepad-terminal = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1f3b1dedfbb81424eb8dbf69e5e2c634fa73dc54" }
# Reads the providers OctoSense's AI providers app enabled. Its loopback
# proxy adds their key to the requests it forwards; no child sees the key.
octosense-llm-config = { git = "https://github.com/OctoSense-org/OctoSense.git", rev = "c19984edbdc0da98ac5675076b8eedd3375728a2" }
# The shell's kernel core dir, where AI providers writes the profile: the
# sanctioned route to the kernel for an app (as Rinx uses it).
octosense-app-peers = { git = "https://github.com/OctoSense-org/OctoSense.git", rev = "c19984edbdc0da98ac5675076b8eedd3375728a2", features = ["octos-core"] }
# An app project's app, previewed under its manifest the way the shell runs
# one (admission, the isolate's jail and limits, its artwork's origin).
octosense-app-policy = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "58c3c8aed8fc811a16d67c5f784a8a44214ff876", features = ["splash"] }
# The octos server's JSON-RPC frames: deep and version-dependent, read by field.
serde_json = "1"
# The agents' programs OctoBuddy keeps: checked against their publishers'
# digests (npm's sha512 integrity, GitHub's sha256).
sha2 = "0.10"
base64 = "0.22"


# Packaged as Robrix is (`cargo packager --release`): robius-packaging-commands
# (0.4 or later) builds it with Makepad's `apple_bundle` and
# `MAKEPAD_PACKAGE_DIR` set, so it reads its fonts and icons from the package,
# and gathers every Makepad crate's resources into ./dist/resources (the
# terminal's fonts too: packaging/terminal-fonts.sh). In the
# package each crate's resources sit under the crate's name: ours under
# `octosense_octobuddy`, not the binary's `octosense-octobuddy`.
[package.metadata.packager]
product_name = "OctoBuddy"
identifier = "org.octosense.octobuddy"
category = "DeveloperTool"
license_file = "LICENSE"
homepage = "https://github.com/tyreseluo/OctoBuddy"
description = "OctoSense's coding app: an outer loop plans, inner loops build"
icons = [
    "./packaging/icons/icon_32.png",
    "./packaging/icons/icon_128.png",
    "./packaging/icons/icon_256.png",
    "./packaging/icons/icon_512.png",
    "./packaging/icons/icon_512@2x.png",
    "./packaging/icons/icon.ico",
]
out_dir = "./dist"
resources = [
    { src = "./dist/resources/makepad_widgets", target = "makepad_widgets" },
    { src = "./dist/resources/makepad_terminal", target = "makepad_terminal" },
    { src = "./dist/resources/octosense-octobuddy", target = "octosense_octobuddy" },
]
before-each-package-command = """
robius-packaging-commands before-each-package \
    --force-makepad \
    --binary-name octosense-octobuddy \
    --path-to-binary ./target/release/octosense-octobuddy \
&& sh ./packaging/terminal-fonts.sh
"""

[package.metadata.packager.macos]
minimum_system_version = "11.0"
# Ad hoc: no Developer ID yet, so the release is not notarized (its notes say
# how to open it the first time).
signing_identity = "-"
