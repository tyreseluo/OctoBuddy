# Packages OctoBuddy (as Robrix does: cargo-packager with
# robius-packaging-commands) and publishes it as a GitHub release.
#
# Builds two DMGs, one per macOS arch (Apple silicon + Intel), from
# macos-15: cross-compiles to x86_64 with `--target x86_64-apple-darwin`
# (chosen over a separate Intel runner — one runner, two parallel matrix
# jobs, no shared runner pool contention, and we already verified the
# cross-compile produces a runnable x86_64 binary on this machine).
# `rust-cache` keys and artifact names both include the target triple
# so the two DMGs don't clobber each other.
#
# Optional notarization. When ALL of these secrets are set on the
# repo, the workflow signs with Developer ID and notarizes via
# `xcrun notarytool` + `xcrun stapler` (cargo-packager does this for
# you when it sees APPLE_CERTIFICATE + APPLE_ID / APPLE_PASSWORD /
# APPLE_TEAM_ID; APPLE_SIGNING_IDENTITY overrides Cargo.toml's ad-hoc
# `signing_identity = "-"`):
#   APPLE_DEVELOPER_ID_CERT_P12_BASE64   base64 of the .p12 (APPLE_CERTIFICATE)
#   APPLE_CERT_PASSWORD                  p12 password        (APPLE_CERTIFICATE_PASSWORD)
#   APPLE_SIGNING_IDENTITY               "Developer ID Application: ... (TEAMID)"
#   APPLE_ID                             Apple ID email
#   APPLE_APP_PASSWORD                   app-specific password (APPLE_PASSWORD)
#   APPLE_TEAM_ID                        10-char team id
# Without them, the run prints a ::notice:: and falls back to ad-hoc
# signing (the existing behavior).
#
# - A tag `vX.Y.Z` (or `vX.Y.Z-pre`) that matches Cargo.toml's version makes a
#   draft release, builds both DMGs and uploads them there, then publishes
#   the release: no one sees it before its DMGs are in it.
# - Run by hand (workflow_dispatch), it builds both DMGs as the run's
#   artifacts; with `create_release` it also makes the release and
#   publishes it.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also create and publish the release (otherwise only the run''s artifacts)'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (default: v + the version in Cargo.toml)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_tag_version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the crate's version
        shell: bash
        run: |
          version=$(awk '/^\[package\]$/ {p=1; next} /^\[/ {p=0} p && $1 == "version" {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          echo "tag: ${GITHUB_REF_NAME}, Cargo.toml: ${version}"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml's version '${version}'."
            exit 1
          fi

  create_release:
    name: Create the draft release
    needs: [check_tag_version]
    if: >-
      ${{ always() && (
        (github.event_name == 'push' && needs.check_tag_version.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      ) }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.release_tag }}"
            if [[ -z "$tag" ]]; then
              tag="v$(awk '/^\[package\]$/ {p=1; next} /^\[/ {p=0} p && $1 == "version" {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Only ever a new release: one already made for this tag is left alone.
      - name: Refuse to reuse an existing release
        shell: bash
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          existing=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | \"id=\(.id) draft=\(.draft)\"")
          if [[ -n "$existing" ]]; then
            echo "::error::A release already exists for '$tag' ($existing); delete it first, deliberately, to release again."
            exit 1
          fi

      - name: Create it as a draft
        shell: bash
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          notes="docs/RELEASE_NOTES_${tag}.md"
          body="${RUNNER_TEMP}/notes.md"
          if [[ -f "$notes" ]]; then
            sed "s|@VERSION@|${tag#v}|g" "$notes" > "$body"
          else
            echo "::warning::No release notes at $notes."
            : > "$body"
          fi
          pre=()
          if [[ "$tag" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$tag" --draft "${pre[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OctoBuddy ${tag}" \
            --notes-file "$body"

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [check_tag_version, create_release]
    if: >-
      ${{ always() && (
        (github.event_name == 'push' && needs.create_release.result == 'success') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Two archs, one runner (macos-15, Apple silicon). The Intel job
        # cross-compiles with --target x86_64-apple-darwin; cargo-packager
        # reads CARGO_PACKAGER_TARGET and uses target/<triple>/release/ for
        # its binary, so the aarch64 build that before-each-package-command
        # runs (for resources and the rpath tweak) does not leak into the
        # DMG.
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the cross target (Intel job on the Apple-silicon runner)
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install the packaging tools
        run: |
          cargo install cargo-packager --locked
          cargo install robius-packaging-commands --locked

      # Ad hoc signed (Cargo.toml's signing_identity "-"), not notarized.
      # When the notarization secrets are all set, the steps that follow
      # override signing_identity and feed cargo-packager the cert + Apple
      # ID creds it needs to sign with a Developer ID and run
      # xcrun notarytool + xcrun stapler on the .app.
      - name: Are the Apple notarization secrets all configured?
        id: notarization
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PWD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERT" && -n "$CERT_PWD" && -n "$IDENTITY" && -n "$APPLE_ID" && -n "$APP_PWD" && -n "$TEAM" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Apple notarization secrets: configured — Developer ID signing + notarytool enabled."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple notarization secrets not all set on this repo; packaging ad-hoc signed, not notarized. See README's Download."
          fi

      # Override signing_identity in Cargo.toml only on the runner's copy;
      # the repo is not changed (the runner is discarded too, but be tidy).
      - name: Use Developer ID for signing
        if: steps.notarization.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.toml Cargo.toml.orig
          sed -i.tmp "s|signing_identity = \"-\"|signing_identity = \"${{ secrets.APPLE_SIGNING_IDENTITY }}\"|g" Cargo.toml
          rm Cargo.toml.tmp
          # Be doubly sure: a follow-up step restores the original on failure.
          echo "Cargo.toml signed-identity now: $(awk '/signing_identity/ {print; exit}' Cargo.toml)"
          trap 'mv Cargo.toml.orig Cargo.toml' EXIT

      # Cross-compile for the matrix target; cargo-packager with
      # --target $TARGET then picks the binary up from target/$TARGET/release/.
      - name: Build the binary for this target
        run: cargo build --release --target "$TARGET"

      - name: Package the DMG
        env:
          APPLE_CERTIFICATE: ${{ steps.notarization.outputs.configured == 'true' && secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.notarization.outputs.configured == 'true' && secrets.APPLE_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ steps.notarization.outputs.configured == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.notarization.outputs.configured == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.notarization.outputs.configured == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: cargo packager --release --formats dmg --target "$TARGET"

      - name: Name it and sum it
        id: dmg
        shell: bash
        run: |
          version=$(awk '/^\[package\]$/ {p=1; next} /^\[/ {p=0} p && $1 == "version" {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          built=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          if [[ -z "$built" ]]; then
            echo "::error::cargo packager made no DMG"; exit 1
          fi
          name="OctoBuddy-${version}-macos-${ARCH}.dmg"
          mv "$built" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
          echo "file=dist/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: OctoBuddy-macos-${{ matrix.arch }}
          path: |
            ${{ steps.dmg.outputs.file }}
            ${{ steps.dmg.outputs.file }}.sha256
          if-no-files-found: error

      - name: Attach it to the release
        if: needs.create_release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create_release.outputs.tag }}" \
            "${{ steps.dmg.outputs.file }}" "${{ steps.dmg.outputs.file }}.sha256" \
            --repo "${{ github.repository }}"

  publish_release:
    name: Publish the release
    needs: [create_release, macos]
    if: ${{ always() && needs.create_release.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only a release with both DMGs and both sums in it.
      - name: Check its assets
        shell: bash
        run: |
          tag="${{ needs.create_release.outputs.tag }}"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$assets"
          for arch in aarch64 x86_64; do
            grep -q "macos-${arch}\.dmg$"       <<< "$assets" || { echo "::error::No macos-${arch}.dmg in $tag."; exit 1; }
            grep -q "macos-${arch}\.dmg\.sha256$" <<< "$assets" || { echo "::error::No macos-${arch}.dmg.sha256 in $tag."; exit 1; }
          done

      - name: Publish it
        shell: bash
        run: |
          tag="${{ needs.create_release.outputs.tag }}"
          latest=(--latest)
          if [[ "$tag" == *-* ]]; then latest=(--latest=false); fi
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false "${latest[@]}"
          gh release view "$tag" --repo "${{ github.repository }}" --json url,isDraft,isPrerelease