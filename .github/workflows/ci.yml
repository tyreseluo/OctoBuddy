name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # macOS: what OctoSense's desktop shell and its dev machines run.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The live tests (the agents' CLIs and providers) are #[ignore]d.
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      # The build OctoSense takes: the module alone.
      - run: cargo clippy --locked --all-targets --no-deps --no-default-features --features octosense-module -- -D warnings
